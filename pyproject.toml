[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sictic-skills"
version = "0.0.0"
description = "SICTIC-AI Python skills"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "apify-client",
    "docling[ocrmac]==2.96.1; platform_system == 'Darwin'",
    "docling==2.96.1; platform_system != 'Darwin'",
    "google-api-python-client",
    "google-auth-oauthlib",
    "langchain-text-splitters",
    "litellm",
    "ocrmac==1.0.1; platform_system == 'Darwin'",
    "ollama",
    "polars",
    "pydantic",
    "python-dotenv",
    "qdrant-client",
    "rapidfuzz",
    "requests",
    "rich",
    "typer",
    "torch==2.10.0",
    "torchvision==0.25.0",
]

[project.scripts]
gdrive-sync = "gdrive_sync.cli:main"

[project.optional-dependencies]
test = ["pytest", "pytest-mock"]

[tool.setuptools.packages.find]
where = [".", "gdrive-sync"]
include = ["skills*", "lib*", "gdrive_sync*"]
