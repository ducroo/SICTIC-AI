# Runs the non-live test suite on every pull request and every push to main.
#
# This is the cheapest safety net available: it uses tests that already exist
# and excludes checks that require live local services or external data.

name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: sictic-env
          auto-activate-base: false

      - name: Run the test suite
        shell: bash -el {0}
        env:
          SICTIC_TESTING: "1"
          RANKED_LLMS: "ollama/test_model:1b"
          PYTHONPATH: .
        run: pytest -q -m "not live"
