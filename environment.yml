name: sictic-env

# Keep one consistent package ecosystem. `nodefaults` prevents Conda from
# silently mixing packages from the Anaconda defaults channel.
channels:
  - conda-forge
  - nodefaults

dependencies:
  # Python 3.13 is supported on macOS and Linux/WSL2. Python 3.14 is not yet
  # supported by Docling's complete dependency chain.
  - python=3.13
  - pip

  # Application dependencies
  - aiohttp
  - jsonschema
  - openpyxl
  - pydantic
  - python-dotenv
  - rapidfuzz
  - requests
  - rich
  - striprtf
  - typer<0.25
  - xlrd

  # Google Drive support. Reconsider after the rclone decision.
  - google-api-python-client
  - google-auth-oauthlib

  # LLM access
  - litellm>=1.97.0

  # Dataset chunking
  - langchain-text-splitters

  # Document conversion
  - docling=2.96.1

  # Temporary compatibility constraints required by Docling 2.96.1.
  # Remove these after a newer Docling release has been tested.
  - transformers<5.9
  - tokenizers<0.23.1

  # Vector database client. Leave unpinned to use the newest compatible
  # conda-forge release. This does not install the Qdrant server.
  - qdrant-client

  # Tests
  - pytest
  - pytest-mock

  # Packages that cannot currently be handled reliably and portably through
  # conda-forge across all supported platforms.
  - pip:
      - apify-client
      - 'ocrmac>=1,<2; platform_system == "Darwin"'
      - 'onnxruntime; platform_system != "Darwin"'
