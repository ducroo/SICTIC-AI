name: sictic-env

# Channels: prefer conda-forge for everything; defaults left as a fallback.
channels:
  - conda-forge
  - defaults

# Source of truth for the runtime is pyproject.toml — this file mirrors it.
# Anything listed under `dependencies:` is installed via conda-forge.
# Anything under `pip:` is installed via pip because it isn't on conda-forge,
# has an `extra` we need (e.g. docling[ocrmac]), or is the editable project.

dependencies:
  # Python 3.12 is the supported runtime on macOS and Linux.
  - python=3.12
  - pip

  # === Runtime deps available on conda-forge (mirrors pyproject.toml) ===
  - aiohttp
  - google-api-python-client
  - google-auth-oauthlib
  - litellm
  - polars
  - pydantic
  - python-dotenv
  - qdrant-client
  - rapidfuzz
  - requests
  - rich
  - typer

  # === Test deps (optional in pyproject; included here for convenience) ===
  - pytest
  - pytest-mock

  - pip:
      # Not on conda-forge. Docling uses ocrmac on macOS and RapidOCR on Linux.
      - apify-client
      - langchain-text-splitters
      - ollama
      - 'docling[ocrmac]==2.72.0; platform_system == "Darwin"'
      - 'docling==2.72.0; platform_system != "Darwin"'
      - torch==2.10.0
      - torchvision==0.25.0
      - 'ocrmac==1.0.1; platform_system == "Darwin"'
      # Editable install of this repo — makes `skills.*` and `lib.*` importable.
      - --editable .
