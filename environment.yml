name: sictic-env

# Channels: prefer conda-forge for everything; defaults left as a fallback.
channels:
  - conda-forge
  - defaults

# This file is the sole source of truth for the Python runtime.
# Anything listed under `dependencies:` is installed via conda-forge.
# Anything under `pip:` is installed via pip because it isn't on conda-forge,
# or has an extra we need (e.g. docling[ocrmac]).

dependencies:
  # Python 3.12 is the supported runtime on macOS and Linux.
  - python=3.12
  - pip

  # === Runtime deps available on conda-forge ===
  - aiohttp
  - google-api-python-client
  - google-auth-oauthlib
  - jsonschema
  # Keep LiteLLM on a GPT-5.6-capable release and prevent conda update --all
  # from downgrading it in order to select the incompatible OpenAI 3.x SDK.
  - litellm=1.97.0
  - openai>=2.20,<3
  # Transformers 5.8.1 rejects tokenizers 0.23.1; conda-forge does not ship 0.23.0.
  - tokenizers=0.22.2
  - polars
  - pydantic
  - python-dotenv
  - qdrant-client
  - rapidfuzz
  - requests
  - rich
  - striprtf=0.0.29
  - typer
  - xlrd

  # === Test deps ===
  - pytest
  - pytest-mock

  - pip:
      # Not on conda-forge. Docling uses ocrmac on macOS and RapidOCR on Linux.
      # RapidOCR needs onnxruntime; it is not pulled in by the base docling wheel.
      - apify-client
      - langchain-text-splitters
      - ollama
      - 'docling[ocrmac]==2.96.1; platform_system == "Darwin"'
      - 'docling==2.96.1; platform_system != "Darwin"'
      - 'onnxruntime; platform_system != "Darwin"'
      - torch==2.10.0
      - torchvision==0.25.0
      - 'ocrmac==1.0.1; platform_system == "Darwin"'
